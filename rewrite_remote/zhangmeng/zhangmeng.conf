#!name=掌盟去广告
#!desc=Quantumult X rewrite for 掌上英雄联盟。先用抓包确认接口，再补充规则。
#!author=hanbo

[rewrite_local]
# 脚本地址：
# https://raw.githubusercontent.com/xihazhiwang/quanx/main/rewrite_remote/zhangmeng/zhangmeng.adblock.js

# HAR 命中的掌盟展示广告位：开屏、浮窗、信息流插入 banner、强弹壳、底栏运营角标。
^https?:\/\/mlol\.qt\.qq\.com\/go\/recommend\/(?:platflashbox|floatbox|platbanner|platstrongshell)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/xihazhiwang/quanx/main/rewrite_remote/zhangmeng/zhangmeng.adblock.js
^https?:\/\/mlol\.qt\.qq\.com\/go\/zone\/(?:bottomtab_tip|newgamereminder)(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/xihazhiwang/quanx/main/rewrite_remote/zhangmeng/zhangmeng.adblock.js
^https?:\/\/mlol\.qt\.qq\.com\/go\/content_svr\/feeds\/activity(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/xihazhiwang/quanx/main/rewrite_remote/zhangmeng/zhangmeng.adblock.js

# 广告隐私状态、统计、崩溃和追踪上报。只处理 HAR 中确认出现的上报域名。
^https?:\/\/ads\.privacy\.qq\.com\/optout\/get_status(?:\?.*)?$ url reject-200
^https?:\/\/(?:hc|receiver)\.tdm\.qq\.com:8013\/tdm\/v1\/(?:route|kv|bin|presign|config)(?:\?.*)?$ url reject-200
^https?:\/\/sentry\.qt\.qq\.com\/api\/\d+\/envelope\/?$ url reject-200
^https?:\/\/gatherer\.m\.qq\.com\/gatherer_conf\/GetConf(?:\?.*)?$ url reject-200
^https?:\/\/szmg\.qq\.com\/(?:cgi-bin\/log_data\.fcg|heartbeat)(?:\?.*)?$ url reject-200
^http:\/\/tracker-01\.qvb\.qcloud\.com\/api\/v5\/mobile\/announce(?:\?.*)?$ url reject-200

# 兜底：广告关键字接口。若发现误伤，再把具体路径从这里拆出去。
^https?:\/\/(?:[^\/]+\.)?(?:qt|lol|game|ams|comm|imgcache|ossweb-img|gameapp)\.(?:qq|tencent)\.com\/.*(?:ad|ads|advert|advertise|splash|startup|launch|popup|poplayer|banner|operation|promotion|material|market).*$ url script-response-body https://raw.githubusercontent.com/xihazhiwang/quanx/main/rewrite_remote/zhangmeng/zhangmeng.adblock.js

# 静态广告素材兜底。抓包确认确实是纯广告素材后再取消注释。
# ^https?:\/\/(?:game|ossweb-img)\.(?:qq|tencent)\.com\/.*(?:ad|ads|advert|splash|banner).*\.(?:jpg|jpeg|png|webp|gif)$ url reject-200
# ^https?:\/\/game\.gtimg\.cn\/.*(?:ad|ads|advert|splash|banner).*\.(?:jpg|jpeg|png|webp|gif)$ url reject-200

[mitm]
hostname = mlol.qt.qq.com, qt.qq.com, *.qt.qq.com, lol.qq.com, *.lol.qq.com, game.qq.com, *.game.qq.com, ams.qq.com, *.ams.qq.com, comm.tencent.com, *.comm.tencent.com, game.gtimg.cn, ossweb-img.qq.com, *.ossweb-img.qq.com, ads.privacy.qq.com, hc.tdm.qq.com, receiver.tdm.qq.com, sentry.qt.qq.com, gatherer.m.qq.com, szmg.qq.com
